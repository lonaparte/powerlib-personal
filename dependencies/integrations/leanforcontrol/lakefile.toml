name = "powerlib_leanforcontrol"
packagesDir = "../../../.."
version = "0.1.0"
defaultTargets = ["LeanForControlSmoke"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "LeanForControl"
git = "https://github.com/AnandGokhale/LeanForControl.git"
rev = "7507ed04d94068fe3e7d4624b3383433a861bea7"

[[lean_lib]]
name = "PowerLibUpstream"
srcDir = "../../.."
roots = ["dependencies.Mathlib", "dependencies.LeanForControl", "theorem.Upstream.LCLLeanForControl"]
globs = [
  "dependencies.Mathlib",
  "dependencies.LeanForControl",
  "theorem.Attributes",
  "theorem.LibrarySearch",
  "theorem.generated.Conversion",
  "theorem.generated.LCLConversion",
  "theorem.RL",
  "theorem.LCL",
  "theorem.Upstream.LeanForControl",
  "theorem.Upstream.LCLLeanForControl",
]

[[lean_lib]]
name = "LeanForControlSmoke"
