name = "powerlib_leanforcontrol"
version = "0.1.0"
defaultTargets = ["LeanForControlSmoke"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5450b53e5ddc75d46418fabb605edbf36bd0beb6"

[[require]]
name = "LeanForControl"
git = "https://github.com/AnandGokhale/LeanForControl.git"
rev = "7507ed04d94068fe3e7d4624b3383433a861bea7"

[[lean_lib]]
name = "PowerLibSearch"
srcDir = "../../.."
roots = ["theorem.Attributes", "theorem.LibrarySearch"]
globs = ["theorem.Attributes", "theorem.LibrarySearch"]

[[lean_lib]]
name = "PowerLibUpstream"
roots = ["dependencies.LeanForControl"]
globs = ["dependencies.LeanForControl"]

[[lean_lib]]
name = "LeanForControlSmoke"
