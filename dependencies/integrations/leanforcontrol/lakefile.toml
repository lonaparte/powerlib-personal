name = "powerlib_leanforcontrol"
packagesDir = "../../../.."
version = "0.1.0"
defaultTargets = ["LeanForControlSmoke"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "LeanForControl"
git = "https://github.com/AnandGokhale/LeanForControl.git"
rev = "7507ed04d94068fe3e7d4624b3383433a861bea7"

[[lean_lib]]
name = "PowerLibUpstream"
srcDir = "../../.."
roots = ["dependencies.Mathlib", "dependencies.LeanForControl", "theorem.LibrarySearch",
  "theorem.Flow.Certificate", "theorem.Linear.Certificate", "theorem.Linear.Realization"]
globs = [
  "dependencies.Mathlib",
  "dependencies.LeanForControl",
  "theorem.Attributes",
  "theorem.LibrarySearch",
  "theorem.TMIO.Generate",
  "theorem.TMIO.Derived",
  "theorem.TMIO.Representation",
  "theorem.TMIO.Relation",
  "theorem.TMIO.Compare",
  "theorem.Flow.Defs",
  "theorem.Flow.Basic",
  "theorem.Flow.Certificate",
  "theorem.Linear.Plant",
  "theorem.Linear.Stability",
  "theorem.Linear.Certificate",
  "theorem.Linear.Transfer",
  "theorem.Linear.Realization",
  "theorem.Architecture",
  "theorem.Family.Basic",
  "theorem.Port.Defs",
  "theorem.Port.Basic",
  "theorem.Port.Linear",
  "theorem.Linear.Family",
  "theorem.Linear.Positive",
  "theorem.Linear.VerifiedSynthesis",
  "theorem.Linear.Synthesis",
  "theorem.Linear.Rate",
  "theorem.Linear.Rational",
]

[[lean_lib]]
name = "LeanForControlSmoke"
