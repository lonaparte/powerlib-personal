name: Proof kernels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enforce formal dependency and local support boundaries
        shell: bash
        run: |
          set -euo pipefail
          invalid_dependencies=$(find dependencies -type f ! -name '*.lean' -print)
          test -z "$invalid_dependencies" || { printf '%s\n' "$invalid_dependencies"; exit 1; }
          nonfiles=$(find dependencies ! -type d ! -type f -print)
          test -z "$nonfiles" || { printf '%s\n' "$nonfiles"; exit 1; }
          local_programs=$(git ls-files -- '*.py' ':(exclude)archive/**')
          test -z "$local_programs" || { printf '%s\n' "$local_programs"; exit 1; }
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          use-mathlib-cache: "true"
          build: "false"
          test: "false"
          lint: "false"
      - name: Install pinned Agda and Cubical outside the repository
        shell: bash
        run: |
          set -euo pipefail
          agda_cache="$RUNNER_TEMP/powerlib-agda"
          mkdir -p "$agda_cache"
          curl --fail --location --retry 3 \
            https://github.com/agda/agda/releases/download/v2.8.0/Agda-v2.8.0-linux.tar.xz \
            --output "$agda_cache/agda.tar.xz"
          printf '%s  %s\n' \
            824081b8dcbe431289a50ac6bd83e451f390c51c3884ac7a8c4a5c0df2632faf \
            "$agda_cache/agda.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$agda_cache/agda.tar.xz" --directory "$agda_cache"
          chmod +x "$agda_cache/agda"
          test "$("$agda_cache/agda" --numeric-version)" = 2.8.0
          git clone --depth 1 --branch v0.9 https://github.com/agda/cubical.git "$agda_cache/cubical"
          test "$(git -C "$agda_cache/cubical" rev-parse HEAD)" = b150186d2544e7efeddd31e5d14a8b9ecbb100f7
          printf '%s\n' "$agda_cache" >> "$GITHUB_PATH"
      - name: Check both Agda foundations
        shell: bash
        run: |
          set -euo pipefail
          agda_stage="$RUNNER_TEMP/powerlib-agda-check"
          mkdir -p "$agda_stage/theorems"
          cp theorems/Conversion.agda theorems/LCLConversion.agda "$agda_stage/theorems/"
          cp powerlib.agda-lib "$agda_stage/"
          printf '%s\n' "$RUNNER_TEMP/powerlib-agda/cubical/cubical.agda-lib" > "$agda_stage/libraries"
          cd "$agda_stage"
          agda --library-file="$agda_stage/libraries" --no-default-libraries theorems/Conversion.agda
          agda --library-file="$agda_stage/libraries" --no-default-libraries theorems/LCLConversion.agda
      - name: Build the pinned public Lean library
        run: lake build
      - name: Verify recorded Agda source identities
        shell: bash
        run: |
          set -euo pipefail
          rl_source=$(sha256sum theorems/Conversion.agda)
          rl_source=${rl_source%% *}
          lcl_source=$(sha256sum theorems/LCLConversion.agda)
          lcl_source=${lcl_source%% *}
          test "$(sed -n 's/^-- Agda source SHA-256: //p' theorems/generated/Conversion.lean)" = "$rl_source"
          test "$(sed -n 's/^-- Agda source SHA-256: //p' theorems/generated/LCLConversion.lean)" = "$lcl_source"
          test "$(sed -n 's/^-- RL branch source SHA-256: //p' theorems/generated/LCLConversion.lean)" = "$rl_source"
      - name: Audit transitive theorem dependencies
        run: lake env lean tests/lean/Audit.lean
      - name: Check native automation and upstream theorem reuse
        timeout-minutes: 10
        run: |
          lake env lean tests/lean/Automation.lean
          lake env lean tests/lean/Upstream.lean
          lake env lean tests/lean/NativeTheoremUse.lean
          lake env lean tests/lean/StateSpacePassivityCases.lean
          lake env lean tests/lean/PublicTheoremRegistry.lean
          lake env lean tests/lean/LCLStorageSynthesis.lean
      - name: Check imported and current-file theorem registration
        shell: bash
        run: |
          set -euo pipefail
          lake build PowerLibTests
          lake env lean tests/lean/Registry.lean
          mkdir -p "$RUNNER_TEMP/powerlib-formal-artifacts"
          lake env lean tests/lean/ExportRegistry.lean \
            | tee "$RUNNER_TEMP/powerlib-formal-artifacts/theorem-registry.log"
          awk '/^POWERLIB_REGISTRY_BEGIN$/{active=1;next} /^POWERLIB_REGISTRY_END$/{active=0;exit} active{print}' \
            "$RUNNER_TEMP/powerlib-formal-artifacts/theorem-registry.log" \
            > "$RUNNER_TEMP/powerlib-formal-artifacts/theorem-registry.json"
          test -s "$RUNNER_TEMP/powerlib-formal-artifacts/theorem-registry.json"
      - name: Check formal public consumers
        run: lake env lean examples/Use.lean
      - name: Retain public theorem metadata and export log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-theorem-registry
          path: ${{ runner.temp }}/powerlib-formal-artifacts
          if-no-files-found: ignore

  leanforcontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: integrations/leanforcontrol
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
      - name: Check upstream reuse and rejection of unapproved axioms
        working-directory: integrations/leanforcontrol
        run: lake env lean LeanForControlSmoke.lean
      - name: Verify dependency lockfiles were preserved
        run: git diff --exit-code -- lake-manifest.json integrations/leanforcontrol/lake-manifest.json
