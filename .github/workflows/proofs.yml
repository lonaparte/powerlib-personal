name: Proof kernels

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      POWERLIB_CACHE_DIR: ${{ runner.temp }}/powerlib-cache
      POWERLIB_RESULTS_DIR: ${{ runner.temp }}/powerlib-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          use-mathlib-cache: "true"
          test: "false"
      - name: Audit project theorems
        run: lake env lean dependencies/tests/Audit.lean
      - name: Check Agda conversion and dependency pins
        run: python3 dependencies/setup.py
      - name: Check LCL conversion
        run: python3 dependencies/lcl_bridge.py
      - name: Check certificates and negative controls
        env:
          POWERLIB_LCL_KERNEL_TESTS: "1"
        run: python3 -m unittest discover -s dependencies/tests -v
