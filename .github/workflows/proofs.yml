name: Proof kernels

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure local build directories
        run: |
          echo "POWERLIB_CACHE_DIR=$RUNNER_TEMP/powerlib-cache" >> "$GITHUB_ENV"
          echo "POWERLIB_RESULTS_DIR=$RUNNER_TEMP/powerlib-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          use-mathlib-cache: "true"
          test: "false"
      - name: Audit project theorems
        run: lake env lean dependencies/tests/Audit.lean
      - name: Check theorem discovery and automatic reuse
        run: lake env lean dependencies/tests/Automation.lean
      - name: Check Agda conversion and dependency pins
        run: python3 dependencies/setup.py
      - name: Check LCL conversion
        run: python3 dependencies/lcl_bridge.py
      - name: Check certificates and negative controls
        env:
          POWERLIB_LCL_KERNEL_TESTS: "1"
        run: python3 -m unittest discover -s dependencies/tests -v
      - name: Check public theorem examples and synthesis paths
        run: |
          lake env lean dependencies/examples/Use.lean
          python3 dependencies/powerlib.py atp dependencies/examples/rl.json
          python3 dependencies/powerlib.py atp dependencies/examples/lcl.json --family lcl
          python3 dependencies/powerlib.py atd
          python3 dependencies/powerlib.py atd --family lcl
      - name: Retain proof artifacts and kernel logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-artifacts
          path: ${{ env.POWERLIB_RESULTS_DIR }}
          if-no-files-found: ignore
