name: Powerlib

on:
  push:
    branches: ["codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch required Mathlib cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = list(Path("Powerlib").rglob("*.lean")) + [Path("PowerlibTests.lean")]
          imports = sorted({line.split()[1] for path in files for line in path.read_text().splitlines()
                            if line.startswith("import Mathlib.")})
          subprocess.run(["lake", "exe", "cache", "get", *imports], check=True)
          PY
      - name: Build core, examples, and axiom audit
        run: lake build
      - name: Bundle dependencies for local proof checking
        if: always()
        run: |
          tar --exclude=.git -czf /tmp/powerlib-dependencies.tar.gz .lake/packages
          split -b 400M /tmp/powerlib-dependencies.tar.gz /tmp/powerlib-dependencies.part-
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-checking-dependencies-a
          path: /tmp/powerlib-dependencies.part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-checking-dependencies-b
          path: /tmp/powerlib-dependencies.part-ab
          retention-days: 1
          compression-level: 0
