name: RL kernel verification
on:
  push:
    branches: [codex/rl-stability-closure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rl-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            .lake/packages
            dependencies/.cache
            ${{ runner.temp }}/lean-4.19.0-linux
          key: rl-proof-4.19.0-agda-2.8.0-v1
      - name: Install pinned Lean
        run: |
          if [ ! -x "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" ]; then
            curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
            tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check Agda, bridge and Lean library
        run: python3 dependencies/setup.py
      - name: Check public API
        timeout-minutes: 2
        run: lake env lean dependencies/examples/Use.lean
      - name: Check every theorem's automatic reuse
        timeout-minutes: 3
        run: python3 dependencies/check_automatic.py
      - name: Synthesize and verify certificates and conjectures
        run: |
          python3 dependencies/powerlib.py atp dependencies/examples/rl.json
          python3 dependencies/powerlib.py atd
      - name: Positive and negative kernel tests
        run: python3 -m unittest discover -s dependencies/tests -v
      - name: Preserve checked certificates and verification logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rl-kernel-evidence
          path: dependencies/results/
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .lake/packages
            dependencies/.cache
            ${{ runner.temp }}/lean-4.19.0-linux
          key: rl-proof-4.19.0-agda-2.8.0-v1
