name = "powerlib"
version = "0.1.0"
defaultTargets = ["powerlib"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "powerlib"
roots = ["powerlib", "theorems"]
globs = ["powerlib", "theorems.+"]
