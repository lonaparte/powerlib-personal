name = "powerlib"
version = "0.1.0"
defaultTargets = ["powerlib"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "LeanForControl"
git = "https://github.com/AnandGokhale/LeanForControl.git"
rev = "7507ed04d94068fe3e7d4624b3383433a861bea7"

[[lean_lib]]
name = "powerlib"
roots = ["powerlib", "theorem", "dependencies"]
globs = ["powerlib", "theorem.+", "dependencies.Mathlib", "dependencies.LeanForControl"]

[[lean_lib]]
name = "PowerLibTests"
roots = ["dependencies.tests.lean.RegistryFixture"]
globs = ["dependencies.tests.lean.RegistryFixture"]
